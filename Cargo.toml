[package]
name = "minbin"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
autobenches = false
autotests = false
license = "MIT"
description = "Minimal, manual, platform-agnostic binary serialization. Predictable encoding, no-std, zero dependencies."
repository = "https://github.com/humacss/minbin"
documentation = "https://docs.rs/minbin"
readme = "README.md"
categories = ["encoding", "no-std", "network-programming"]
keywords = ["serialization", "no-std", "binary", "encoding", "manual"]
authors = ["humacss"]

[dependencies]
# No dependencies

[dev-dependencies]
rstest = "0.26.1"
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["std", "hash"]
alloc = []
std = ["alloc"]
hash = ["std"]

[[test]]
name = "core"

[[test]]
name = "alloc"
required-features = ["alloc"]

[[test]]
name = "hash"
required-features = ["hash"]

[[test]]
name = "macros"

[[bench]]
name = "core"
path = "benches/core/main.rs"
harness = false

[[bench]]
name = "alloc"
path = "benches/alloc/main.rs"
harness = false
required-features = ["alloc"]

[[bench]]
name = "hash"
path = "benches/hash/main.rs"
harness = false
required-features = ["hash"]

[[bench]]
name = "macros"
path = "benches/macros/main.rs"
harness = false

[[example]]
name = "macro_enum"
required-features = ["alloc"]

[[example]]
name = "macro_struct"
required-features = ["alloc"]

[[example]]
name = "manual_enum"
required-features = ["alloc"]

[[example]]
name = "manual_struct"
required-features = ["alloc"]

[package.metadata.docs.rs]
all-features = true
