name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  feature-suites:
    name: ${{ matrix.suite.name }} (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.90.0", stable]
        suite:
          - name: core
            features: ""
          - name: macros
            features: ""
          - name: alloc
            features: "--features alloc"
          - name: hash
            features: "--features hash"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test feature integration suite
        run: cargo +${{ matrix.toolchain }} test --test ${{ matrix.suite.name }} --no-default-features ${{ matrix.suite.features }}
      - name: Test library
        run: cargo +${{ matrix.toolchain }} test --lib --no-default-features ${{ matrix.suite.features }}
      - name: Test documentation examples
        run: cargo +${{ matrix.toolchain }} test --doc --no-default-features ${{ matrix.suite.features }}
      - name: Build documentation (strict on Rust 1.90)
        env:
          RUSTDOCFLAGS: ${{ matrix.toolchain == '1.90.0' && '-D warnings' || '' }}
        run: cargo +${{ matrix.toolchain }} doc --no-deps --no-default-features ${{ matrix.suite.features }}
      - name: Smoke-test feature benchmarks (no timing measurements)
        run: cargo +${{ matrix.toolchain }} bench --bench ${{ matrix.suite.name }} --no-default-features ${{ matrix.suite.features }} -- --test

  feature-combinations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.90.0", stable]
        features: ["--no-default-features --features std", "--all-features"]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test combined features
        run: cargo +${{ matrix.toolchain }} test ${{ matrix.features }}
      - name: Check all combined targets
        run: cargo +${{ matrix.toolchain }} check --all-targets ${{ matrix.features }}

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust tools
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check formatting
        run: cargo +1.90.0 fmt --check
      - name: Check lints
        run: cargo +1.90.0 clippy --all-targets --all-features -- -D warnings
      - name: Check without a standard library
        run: cargo +1.90.0 check --lib --no-default-features --target wasm32-unknown-unknown
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.90.0 doc --no-deps --all-features
      - name: Test README examples
        run: |
          cargo +1.90.0 build --all-features
          rustdoc +1.90.0 --edition=2021 --test README.md --extern minbin=target/debug/libminbin.rlib
      - name: Verify publishable package without uploading
        run: cargo +1.90.0 publish --dry-run
